disabled_rules:
  - colon
  - file_length
  - implicit_optional_initialization
  - line_length

opt_in_rules:
  - attributes
  - empty_count
  - file_header
  - force_cast
  - force_try
  - force_unwrapping

attributes:
  always_on_same_line: ["@AppStorage", "@Environment", "@UIApplicationDelegateAdaptor"]

identifier_name:
  excluded: ["^db$", "^on$", "^id$", "^to$"]

file_header:
  required_pattern: |
                    \/\/
                    \/\/  .*?\.swift
                    \/\/  Restructure
                    \/\/
                    \/\/  Created by .*? on \d{4}-\d{2}-\d{2}\.
                    \/\/  SPDX-License-Identifier: MIT
                    \/\/

force_unwrapping:
  severity: error
